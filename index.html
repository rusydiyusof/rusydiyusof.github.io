<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rusydi Yusof — Data Engineer</title>
<meta name="description" content="Rusydi Yusof — data engineer working across SQL, Python and DevOps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --border:#e4e4e7;
    --text:#18181b;
    --muted:#52525b;
    --subtle:#71717a;
    --accent:#1d4ed8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0c0e;
      --surface:#141619;
      --border:#26282d;
      --text:#f4f4f5;
      --muted:#a1a1aa;
      --subtle:#8b8b94;
      --accent:#7ba2ff;
    }
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .card{
    width:100%;
    max-width:460px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:40px 36px;
  }

  .avatar{
    width:64px;
    height:64px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--text);
    color:var(--bg);
    font-size:20px;
    font-weight:600;
    letter-spacing:0.5px;
    margin-bottom:24px;
  }

  h1{
    font-size:24px;
    font-weight:600;
    letter-spacing:-0.02em;
  }
  .role{
    color:var(--muted);
    font-size:15px;
    margin-top:4px;
  }

  .summary{
    color:var(--muted);
    font-size:15px;
    margin-top:20px;
  }

  hr{
    border:0;
    border-top:1px solid var(--border);
    margin:28px 0;
  }

  h2{
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--subtle);
    margin-bottom:12px;
  }

  .skills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    list-style:none;
  }
  .skills li{
    border:1px solid var(--border);
    border-radius:6px;
    padding:5px 12px;
    font-size:13px;
    font-weight:500;
    color:var(--muted);
  }

  .links{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    list-style:none;
    margin-top:28px;
  }
  .links a{
    color:var(--accent);
    font-size:14px;
    font-weight:500;
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color 0.15s ease;
  }
  .links a:hover{ border-bottom-color:currentColor; }

  footer{
    margin-top:32px;
    color:var(--subtle);
    font-size:13px;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">RY</div>

    <h1>Rusydi Yusof</h1>
    <p class="role">Data Engineer</p>

    <p class="summary">
      I build and maintain the pipelines, models and infrastructure that turn
      raw data into something teams can rely on.
    </p>

    <hr>

    <h2>Core skills</h2>
    <ul class="skills">
      <li>SQL</li>
      <li>Python</li>
      <li>DevOps</li>
    </ul>

    <ul class="links">
      <li><a href="https://github.com/rusydiyusof">GitHub</a></li>
      <li><a href="mailto:rusydidev@gmail.com">Email</a></li>
    </ul>

    <footer>Learn and relearn.</footer>
  </main>
</body>
</html>
