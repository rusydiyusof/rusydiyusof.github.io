<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rusydi Yusof</title>
<style>
  :root{
    --bg:#0d1117;
    --card:#161b22;
    --border:#2a3038;
    --text:#e6edf3;
    --muted:#8b949e;
    --accent:#58a6ff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 50% 0%, #1a2230, var(--bg));
    color:var(--text);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:40px 36px;
    max-width:420px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .avatar{
    width:96px;
    height:96px;
    border-radius:50%;
    margin:0 auto 20px;
    background:linear-gradient(135deg, var(--accent), #1f6feb);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    font-weight:700;
    color:#fff;
  }
  h1{
    font-size:22px;
    font-weight:600;
  }
  .role{
    color:var(--accent);
    font-size:14px;
    margin-top:6px;
    letter-spacing:0.3px;
  }
  .divider{
    height:1px;
    background:var(--border);
    margin:22px 0;
  }
  .skills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-bottom:22px;
  }
  .skill{
    background:#1f2733;
    border:1px solid var(--border);
    color:var(--text);
    font-size:12px;
    padding:6px 12px;
    border-radius:999px;
  }
  .fact{
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
    font-style:italic;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">RY</div>
    <h1>Rusydi Yusof</h1>
    <div class="role">Business Intelligence & Data Analytics Lead</div>
    <div class="divider"></div>
    <div class="skills">
      <span class="skill">SQL</span>
      <span class="skill">Power BI</span>
      <span class="skill">Python</span>
      <span class="skill">Data Engineering</span>
      <span class="skill">Automation</span>
    </div>
    <p class="fact">Suka main pingpong.</p>
  </div>
</body>
</html>
